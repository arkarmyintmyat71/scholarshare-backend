# Base configuration. Contains NO secrets: they come from environment variables
# (or from the git-ignored application-local.yaml used while developing).
#
# Required environment variables when not using the "local" profile:
#   DB_PASSWORD, JWT_SECRET   (optional: DB_URL, DB_USERNAME, CORS_ORIGINS...)

spring:
  application:
    name: scholarshare-backend

  profiles:
    default: local        # no profile given -> loads application-local.yaml

  datasource:
    url: jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/scholarshare_db?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
    username: 4TJRiGGNp1ReDGW.root
    password: 9v3kAsYxW15WOn4H
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # use "validate" + a migration tool (Flyway) in production
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  servlet:
    context-path: /api     # every URL below starts with /api  (e.g. POST /api/auth/login)

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: oY9ISzMqyrSljCQcebeyrY70rZwp+wKuETagneodNzM=          # at least 32 characters
  expiration: 86400000             # access token lifetime: 24 hours (milliseconds)

app:
  cors:
    # Origins allowed to call the API from a browser. Not needed in dev when the
    # frontend uses the Vite proxy, but required for a deployed frontend.
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
  google:
    # OAuth client id from Google Cloud Console (see README). Empty = Google sign-in is switched off.
    client-id: 500795963319-pcjhedhq7j8q7hqnf6gc3f9hdr7sp313.apps.googleusercontent.com
  seed-admin:
    enabled: false                 # creates the first ADMIN account on startup when true
    name: Administrator
    email: admin@scholarshare.com
    password: Admin@12345
